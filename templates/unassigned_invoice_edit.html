{% extends "base.html" %}

{% block title %}Számlasor szerkesztése - Parkl Infra Manager{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1>Számlasor szerkesztése</h1>
    <p class="text-secondary mb-0">Pénzügyi adatok és tisztázási kapcsolatok módosítása.</p>
  </div>
  <a class="btn btn-outline-secondary btn-sm btn-icon" href="{{ url_for('unassigned_invoices') }}"><i class="bi bi-arrow-left"></i> Vissza</a>
</div>
<form method="post" class="form-panel">
  {% include "_unassigned_invoice_fields.html" %}
  <div class="mt-4 d-flex gap-2">
    <button class="btn btn-purple btn-icon" type="submit"><i class="bi bi-save"></i> Mentés</button>
    <a class="btn btn-outline-secondary" href="{{ url_for('unassigned_invoices') }}">Mégse</a>
  </div>
</form>
{% endblock %}
