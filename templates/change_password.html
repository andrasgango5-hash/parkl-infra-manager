{% extends "base.html" %}

{% block title %}Jelszócsere - Parkl Infra Manager{% endblock %}

{% block content %}
<div class="login-shell">
  <div class="login-panel">
    <h1 class="h3 mb-1">Jelszócsere</h1>
    <p class="text-secondary mb-4">
      {% if forced %}
        Első belépéskor kötelező saját jelszót beállítani.
      {% else %}
        Állíts be új, biztonságos jelszót.
      {% endif %}
    </p>
    <form method="post">
      <div class="mb-3">
        <label class="form-label" for="current_password">Jelenlegi jelszó</label>
        <input class="form-control" id="current_password" name="current_password" type="password" autocomplete="current-password" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label" for="new_password">Új jelszó</label>
        <input class="form-control" id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="12" required>
        <div class="form-text">Legalább 12 karakter.</div>
      </div>
      <div class="mb-4">
        <label class="form-label" for="new_password_confirm">Új jelszó megerősítése</label>
        <input class="form-control" id="new_password_confirm" name="new_password_confirm" type="password" autocomplete="new-password" minlength="12" required>
      </div>
      <button class="btn btn-purple w-100" type="submit">Jelszó mentése</button>
    </form>
  </div>
</div>
{% endblock %}
