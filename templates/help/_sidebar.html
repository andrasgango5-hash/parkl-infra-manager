<aside class="docs-sidebar">
  <a class="docs-home-link {% if request.endpoint == 'help_page' %}active{% endif %}" href="{{ url_for('help_page') }}"><i class="bi bi-house"></i> Dokumentáció kezdőlap</a>
  <form class="docs-sidebar-search" method="get" action="{{ url_for('help_search') }}">
    <i class="bi bi-search"></i>
    <input name="q" value="{{ query or '' }}" placeholder="Keresés...">
  </form>
  <nav aria-label="Dokumentáció tartalomjegyzék">
    {% for group in documentation_groups %}
    <div class="docs-nav-group">
      <strong>{{ group.title }}</strong>
      {% for item in group.pages %}
      <a class="{% if current_slug == item.slug %}active{% endif %}" href="{{ url_for('help_article', slug=item.slug) }}">
        <i class="bi {{ item.icon }}"></i><span>{{ item.title }}</span>
      </a>
      {% endfor %}
    </div>
    {% endfor %}
  </nav>
</aside>
