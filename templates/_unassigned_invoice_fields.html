<div class="row g-3">
  <div class="col-md-4"><label class="form-label" for="invoice_number">Számlaszám</label><input class="form-control" id="invoice_number" name="invoice_number" value="{{ item.invoice_number or '' }}"></div>
  <div class="col-md-4"><label class="form-label" for="partner">Partner</label><input class="form-control" id="partner" name="partner" value="{{ item.partner or '' }}"></div>
  <div class="col-md-4"><label class="form-label" for="currency">Deviza</label><input class="form-control" id="currency" name="currency" value="{{ item.currency or '' }}"></div>
  <div class="col-md-4"><label class="form-label" for="invoice_date">Számla kelte</label><input class="form-control" id="invoice_date" name="invoice_date" type="date" value="{{ item.invoice_date or '' }}"></div>
  <div class="col-md-4"><label class="form-label" for="accounting_fulfillment_date">Számviteli teljesítés</label><input class="form-control" id="accounting_fulfillment_date" name="accounting_fulfillment_date" type="date" value="{{ item.accounting_fulfillment_date or '' }}"></div>
  <div class="col-md-4"><label class="form-label" for="payment_deadline">Fizetési határidő</label><input class="form-control" id="payment_deadline" name="payment_deadline" type="date" value="{{ item.payment_deadline or '' }}"></div>
  <div class="col-12"><label class="form-label" for="description">Megnevezés</label><textarea class="form-control" id="description" name="description" rows="2">{{ item.description or '' }}</textarea></div>
  <div class="col-md-3"><label class="form-label" for="quantity">Mennyiség</label><input class="form-control" id="quantity" name="quantity" type="number" step="0.01" value="{{ item.quantity if item.quantity is not none else '' }}"></div>
  <div class="col-md-3"><label class="form-label" for="unit_price_huf">Egység nettó érték (HUF)</label><input class="form-control" id="unit_price_huf" name="unit_price_huf" type="number" step="0.01" value="{{ item.unit_price_huf if item.unit_price_huf is not none else '' }}"></div>
  <div class="col-md-3"><label class="form-label" for="net_amount_huf">Összes nettó érték (HUF)</label><input class="form-control" id="net_amount_huf" name="net_amount_huf" type="number" step="0.01" value="{{ item.net_amount_huf if item.net_amount_huf is not none else '' }}"></div>
  <div class="col-md-3"><label class="form-label" for="vat_amount_huf">Összes ÁFA (HUF)</label><input class="form-control" id="vat_amount_huf" name="vat_amount_huf" type="number" step="0.01" value="{{ item.vat_amount_huf if item.vat_amount_huf is not none else '' }}"></div>
  <div class="col-md-4"><label class="form-label" for="line_gross_amount_huf">Összes bruttó érték (HUF)</label><input class="form-control" id="line_gross_amount_huf" name="line_gross_amount_huf" type="number" step="0.01" value="{{ item.line_gross_amount_huf if item.line_gross_amount_huf is not none else '' }}"></div>
  <div class="col-md-4"><label class="form-label" for="gross_amount_huf">Számla bruttó összege (HUF)</label><input class="form-control" id="gross_amount_huf" name="gross_amount_huf" type="number" step="0.01" value="{{ item.gross_amount_huf if item.gross_amount_huf is not none else '' }}"></div>
  <div class="col-md-4"><label class="form-label" for="assignment_status">Tisztázási státusz</label><select class="form-select" id="assignment_status" name="assignment_status">{% for status, label in assignment_statuses.items() %}<option value="{{ status }}" {% if item.assignment_status == status %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
  <div class="col-md-4"><label class="form-label" for="assigned_project_id">Projekt</label><select class="form-select" id="assigned_project_id" name="assigned_project_id"><option value="">Nincs</option>{% for project in projects %}<option value="{{ project.id }}" {% if item.assigned_project_id == project.id %}selected{% endif %}>{{ project.code }} - {{ project.name }}</option>{% endfor %}</select></div>
  <div class="col-md-4"><label class="form-label" for="assigned_device_id">Eszköz</label><select class="form-select" id="assigned_device_id" name="assigned_device_id"><option value="">Nincs</option>{% for device in devices %}<option value="{{ device.id }}" {% if item.assigned_device_id == device.id %}selected{% endif %}>{{ device_primary_label(device) }}</option>{% endfor %}</select></div>
  <div class="col-md-4"><label class="form-label" for="responsible_user_id">Felelős</label><select class="form-select" id="responsible_user_id" name="responsible_user_id"><option value="">Nincs kijelölve</option>{% for user in responsible_users %}<option value="{{ user.id }}" {% if item.responsible_user_id == user.id %}selected{% endif %}>{{ user.username }}</option>{% endfor %}</select></div>
  <div class="col-12"><label class="form-label" for="notes">Megjegyzés</label><textarea class="form-control" id="notes" name="notes" rows="2">{{ item.notes or '' }}</textarea></div>
</div>
