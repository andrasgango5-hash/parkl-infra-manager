{% extends "base.html" %}

{% block title %}Eszköz szerkesztése{% endblock %}

{% block content %}
<div class="page-header"><h1>Eszköz szerkesztése</h1></div>
<form method="post" class="form-panel">
  <h2>{{ device.asset_tag }}</h2>
  <div class="row g-3">
    <div class="col-md-4"><label class="form-label" for="asset_tag">Eszközazonosító</label><input class="form-control" id="asset_tag" name="asset_tag" value="{{ device.asset_tag }}" required></div>
    <div class="col-md-4"><label class="form-label" for="serial_number">Sorozatszám</label><input class="form-control" id="serial_number" name="serial_number" value="{{ device.serial_number }}"></div>
    <div class="col-md-4"><label class="form-label" for="product_name">Terméknév</label><input class="form-control" id="product_name" name="product_name" value="{{ device.product_name or '' }}"></div>
    <div class="col-md-4">
      <label class="form-label" for="device_type">Kategória</label>
      <select class="form-select" id="device_type" name="device_type" required>
        {% for category in categories %}
          <option value="{{ category }}" {% if device.device_type == category %}selected{% endif %}>{{ category_label(category) }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-4"><label class="form-label" for="subtype_note">Altípus / megjegyzés</label><input class="form-control" id="subtype_note" name="subtype_note" value="{{ device.subtype_note or '' }}"></div>
    <div class="col-md-4"><label class="form-label" for="supplier_manufacturer">Beszállító / gyártó</label><input class="form-control" id="supplier_manufacturer" name="supplier_manufacturer" value="{{ device.supplier_manufacturer or '' }}"></div>
    <div class="col-md-4"><label class="form-label" for="manufacturer">Gyártó</label><input class="form-control" id="manufacturer" name="manufacturer" value="{{ device.manufacturer }}"></div>
    <div class="col-md-4"><label class="form-label" for="model">Modell</label><input class="form-control" id="model" name="model" value="{{ device.model }}"></div>
    <div class="col-md-4"><label class="form-label" for="version">Verzió</label><input class="form-control" id="version" name="version" value="{{ device.version or '' }}"></div>
    <div class="col-md-3"><label class="form-label" for="quantity">Mennyiség</label><input class="form-control" id="quantity" name="quantity" type="number" step="0.01" value="{{ device.quantity or '' }}"></div>
    <div class="col-md-3"><label class="form-label" for="unit_net_price">Nettó egységár</label><input class="form-control" id="unit_net_price" name="unit_net_price" type="number" step="0.01" value="{{ device.unit_net_price or '' }}"></div>
    <div class="col-md-3"><label class="form-label" for="currency">Deviza</label><input class="form-control" id="currency" name="currency" value="{{ device.currency or '' }}"></div>
    <div class="col-md-3"><label class="form-label" for="huf_value">Érték (HUF)</label><input class="form-control" id="huf_value" name="huf_value" type="number" step="0.01" value="{{ device.huf_value or '' }}"></div>
    <div class="col-md-4"><label class="form-label" for="project_id">Projekt</label><select class="form-select" id="project_id" name="project_id"><option value="">Nincs</option>{% for project in projects %}<option value="{{ project.id }}" {% if device.project_id == project.id %}selected{% endif %}>{{ project.code }} - {{ project.name }}</option>{% endfor %}</select></div>
    <div class="col-md-4"><label class="form-label" for="location_id">Készlethely</label><select class="form-select" id="location_id" name="location_id"><option value="">Nincs</option>{% for location in locations %}<option value="{{ location.id }}" {% if device.location_id == location.id %}selected{% endif %}>{{ location.name }}</option>{% endfor %}</select></div>
    <div class="col-md-4"><label class="form-label" for="assignment_quantity">Hozzárendelt mennyiség</label><input class="form-control" id="assignment_quantity" name="assignment_quantity" type="number" step="0.01" value="{{ device.assignment_quantity or '' }}"></div>
    <div class="col-md-4"><label class="form-label" for="order_date">Rendelés napja</label><input class="form-control" id="order_date" name="order_date" type="date" value="{{ device.order_date or '' }}"></div>
    <div class="col-md-4"><label class="form-label" for="planned_arrival_date">Tervezett érkezés</label><input class="form-control" id="planned_arrival_date" name="planned_arrival_date" type="date" value="{{ device.planned_arrival_date or '' }}"></div>
    <div class="col-md-4"><label class="form-label" for="actual_arrival_date">Tényleges érkezés</label><input class="form-control" id="actual_arrival_date" name="actual_arrival_date" type="date" value="{{ device.actual_arrival_date or '' }}"></div>
    <div class="col-md-3"><div class="form-check form-switch mt-4"><input class="form-check-input" id="is_ordered" name="is_ordered" type="checkbox" {% if device.is_ordered %}checked{% endif %}><label class="form-check-label" for="is_ordered">Megrendelve</label></div></div>
    <div class="col-md-3"><div class="form-check form-switch mt-4"><input class="form-check-input" id="has_arrived" name="has_arrived" type="checkbox" {% if device.has_arrived %}checked{% endif %}><label class="form-check-label" for="has_arrived">Megérkezett</label></div></div>
    <div class="col-md-3"><div class="form-check form-switch mt-4"><input class="form-check-input" id="supplier_invoice_paid" name="supplier_invoice_paid" type="checkbox" {% if device.supplier_invoice_paid %}checked{% endif %}><label class="form-check-label" for="supplier_invoice_paid">Beszállítói számla fizetve</label></div></div>
    <div class="col-md-3"><div class="form-check form-switch mt-4"><input class="form-check-input" id="shipping_invoice_paid" name="shipping_invoice_paid" type="checkbox" {% if device.shipping_invoice_paid %}checked{% endif %}><label class="form-check-label" for="shipping_invoice_paid">Szállítmányozói számla fizetve</label></div></div>
    <div class="col-md-4"><label class="form-label" for="shipping_cost">Szállítási költség</label><input class="form-control" id="shipping_cost" name="shipping_cost" type="number" step="0.01" value="{{ device.shipping_cost or '' }}"></div>
    <div class="col-md-4"><label class="form-label" for="shipping_date">Elszállítás napja</label><input class="form-control" id="shipping_date" name="shipping_date" type="date" value="{{ device.shipping_date or '' }}"></div>
    <div class="col-md-4"><label class="form-label" for="invoice_value">Számla értéke</label><input class="form-control" id="invoice_value" name="invoice_value" type="number" step="0.01" value="{{ device.invoice_value or '' }}"></div>
    <div class="col-md-6"><label class="form-label" for="supplier_invoice_number">Beszállítói számlaszám</label><input class="form-control" id="supplier_invoice_number" name="supplier_invoice_number" value="{{ device.supplier_invoice_number or '' }}"></div>
    <div class="col-md-6"><label class="form-label" for="shipping_invoice_number">Szállítmányozói számlaszám</label><input class="form-control" id="shipping_invoice_number" name="shipping_invoice_number" value="{{ device.shipping_invoice_number or '' }}"></div>
    <div class="col-12"><label class="form-label" for="assignment_notes">Hozzárendelési megjegyzés</label><textarea class="form-control" id="assignment_notes" name="assignment_notes" rows="2">{{ device.assignment_notes or '' }}</textarea></div>
  </div>
  <p class="text-secondary small mt-3 mb-0">A státusz csak készletművelettel módosítható, nem ezen az űrlapon.</p>
  <div class="mt-3 d-flex gap-2">
    <button class="btn btn-success" type="submit">Mentés</button>
    <a class="btn btn-outline-secondary" href="{{ url_for('device_detail', device_id=device.id) }}">Mégse</a>
  </div>
</form>
{% endblock %}
